configs:
  homepage-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:3000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:

  homepage-ts:
    image: tailscale/tailscale:latest
    container_name: homepage-ts
    hostname: homepage
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    configs:
      - source: homepage-ts-serve
        target: /config/serve.json
    volumes:
      - homepage-ts-state:/var/lib/tailscale
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    network_mode: service:homepage-ts
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - homepage.group=Admin
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=https://homepage.chimera-ling.ts.net
      - homepage.description=Service dashboard
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}

volumes:
  homepage-ts-state: