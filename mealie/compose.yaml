configs:
  mealie-ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:9000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  mealie-ts:
    image: tailscale/tailscale:latest
    container_name: mealie-ts
    hostname: mealie
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    configs:
      - source: mealie-ts-serve
        target: /config/serve.json
    volumes:
      - mealie-ts-state:/var/lib/tailscale
    ports:
      - "9000:9000"
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.11.0 
    container_name: mealie
    restart: unless-stopped
    volumes:
      - mealie-data:/app/data/
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: service:mealie-ts
    labels:
      - homepage.group=Media
      - homepage.name=Mealie
      - homepage.icon=mealie.png
      - homepage.href=https://mealie.chimera-ling.ts.net
      - homepage.description=Recipe manager


  postgres:
    container_name: postgres
    image: postgres:17
    restart: unless-stopped
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGUSER=${PGUSER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  mealie-data:
  mealie-pgdata:
  mealie-ts-state:
